name: Deploy to VPS

on:
  push:
    branches: [claude/salom-g8fylr]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync backend source
        run: |
          rsync -az --delete \
            --exclude 'node_modules' --exclude '.env' --exclude 'uploads' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            backend/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/aistudio/backend/"

      - name: Sync frontend source
        run: |
          rsync -az --delete \
            --exclude 'node_modules' --exclude '.env' --exclude 'dist' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            frontend/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/aistudio/frontend/"

      - name: Install, migrate, build, restart
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /var/www/aistudio/backend
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npx prisma db seed

            cd /var/www/aistudio/frontend
            npm ci
            npm run build

            cd /var/www/aistudio/backend

            if pm2 describe aistudio-backend > /dev/null 2>&1; then
              pm2 reload aistudio-backend
            else
              pm2 start src/server.js --name aistudio-backend
            fi

            # The worker only makes sense with Redis configured; without it the
            # API runs jobs in-process and a worker would just exit(1) on boot.
            if grep -qE "^REDIS_URL=.+" .env; then
              if pm2 describe aistudio-worker > /dev/null 2>&1; then
                pm2 reload aistudio-worker
              else
                pm2 start src/worker.js --name aistudio-worker
              fi
            else
              echo "REDIS_URL not set in .env — skipping worker (jobs run in-process)"
            fi

            pm2 save
          '
